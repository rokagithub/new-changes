:root {
  --dur-fast: 140ms;
  --dur-base: 240ms;
  --dur-slow: 320ms;
  --dur-reveal: 420ms;
}
html, body, #root {
  height: 100%;
}
html {
  color-scheme: light;
}
body {
  margin: 0;
  background-color: var(--color-canvas);
  background-image: radial-gradient(900px 520px at 100% -8%, rgb(255 61 71 / 0.07), transparent 62%), radial-gradient(820px 560px at 62% -18%, rgb(138 111 232 / 0.08), transparent 60%), radial-gradient(760px 520px at 18% -22%, rgb(59 125 184 / 0.08), transparent 60%);
  background-attachment: fixed;
  color: var(--color-ink);
  font-family: var(--font-sans);
  font-size: 14px;
  font-weight: 420;
  line-height: 1.5;
  font-optical-sizing: auto;
  font-synthesis: none;
  text-rendering: optimizeLegibility;
  -webkit-text-size-adjust: 100%;
}
.grid > *, .flex > * {
  min-width: 0;
}
h1, h2, h3 {
  text-wrap: balance;
  letter-spacing: -0.011em;
}
b, strong {
  font-weight: 600;
}
button, [role="button"], a, select, summary {
  cursor: pointer;
}
:focus-visible {
  outline: 2px solid var(--color-brand-400);
  outline-offset: 2px;
  border-radius: 8px;
}
:focus:not(:focus-visible) {
  outline: none;
}
.nav-link:focus-visible {
  outline-offset: -2px;
  border-radius: 12px;
}
::selection {
  background: var(--color-brand-100);
}
* {
  scrollbar-width: thin;
  scrollbar-color: #d3cfc8 transparent;
}
@keyframes rise {
  from {
    opacity: 0;
    transform: translateY(10px);
  }
  to {
    opacity: 1;
    transform: none;
  }
}
@keyframes fade {
  from {
    opacity: 0;
  }
  to {
    opacity: 1;
  }
}
@keyframes pop {
  from {
    opacity: 0;
    transform: translateY(6px) scale(0.97);
  }
  to {
    opacity: 1;
    transform: none;
  }
}
@keyframes draw {
  from {
    stroke-dashoffset: 1;
  }
  to {
    stroke-dashoffset: 0;
  }
}
@keyframes grow-y {
  from {
    transform: scaleY(0);
  }
  to {
    transform: scaleY(1);
  }
}
@keyframes grow-x {
  from {
    transform: scaleX(0);
  }
  to {
    transform: scaleX(1);
  }
}
@keyframes shimmer {
  from {
    background-position: 200% 0;
  }
  to {
    background-position: -200% 0;
  }
}
@keyframes ring {
  0% {
    transform: scale(0.9);
    opacity: 0.55;
  }
  100% {
    transform: scale(1.9);
    opacity: 0;
  }
}
@keyframes blink {
  50% {
    opacity: 0;
  }
}
@keyframes check {
  from {
    stroke-dashoffset: 1;
  }
  to {
    stroke-dashoffset: 0;
  }
}
@keyframes page-in {
  from {
    opacity: 0;
    transform: translateY(6px);
  }
  to {
    opacity: 1;
    transform: none;
  }
}
@keyframes toast-in {
  from {
    opacity: 0;
    transform: translateX(28px) scale(0.98);
  }
  to {
    opacity: 1;
    transform: none;
  }
}
@keyframes toast-out {
  to {
    opacity: 0;
    transform: translateX(28px) scale(0.98);
  }
}
@keyframes countdown {
  from {
    transform: scaleX(1);
  }
  to {
    transform: scaleX(0);
  }
}
@keyframes dot {
  0%, 80%, 100% {
    opacity: 0.25;
    transform: translateY(0);
  }
  40% {
    opacity: 1;
    transform: translateY(-3px);
  }
}
@keyframes settle {
  0% {
    box-shadow: 0 0 0 0 rgb(18 45 64 / 0.28);
  }
  100% {
    box-shadow: 0 0 0 10px rgb(18 45 64 / 0);
  }
}
.rise {
  animation: rise var(--dur-reveal) var(--ease-expo) backwards;
  animation-delay: calc(var(--i, 0) * 35ms);
}
.fade-in {
  animation: fade var(--dur-base) ease backwards;
}
.pop-in {
  animation: pop var(--dur-base) var(--ease-expo) backwards;
}
.page.intro-first, .page.intro-none {
  animation: fade 180ms ease-out backwards;
}
.page-enter {
  animation: page-in 240ms cubic-bezier(0.22, 1, 0.36, 1) backwards;
}
.page.intro-none :is(.draw-line, .area-fade, .grow-x, .grow-y) {
  animation: none;
}
.app-scroll {
  scrollbar-gutter: stable;
  overflow-anchor: none;
}
.draw-line {
  stroke-dasharray: 1;
  animation: draw 1.1s var(--ease-expo) both;
  animation-delay: 0.15s;
}
.grow-y {
  transform-origin: bottom;
  transform-box: fill-box;
  animation: grow-y 0.7s var(--ease-expo) both;
  animation-delay: calc(var(--i, 0) * 35ms + 100ms);
}
.grow-x {
  transform-origin: left;
  animation: grow-x 0.8s var(--ease-expo) both;
  animation-delay: calc(var(--i, 0) * 60ms + 100ms);
}
.area-fade {
  animation: fade 0.8s ease both;
  animation-delay: 0.45s;
}
.toast-in {
  animation: toast-in var(--dur-base) var(--ease-expo) backwards;
}
.toast-out {
  animation: toast-out 200ms ease-in forwards;
}
.toast-timer {
  transform-origin: left;
  animation: countdown 4.2s linear forwards;
}
.thinking i {
  display: inline-block;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--color-brand-500);
  animation: dot 1.1s ease-in-out infinite;
}
.thinking i:nth-child(2) {
  animation-delay: 0.15s;
}
.thinking i:nth-child(3) {
  animation-delay: 0.3s;
}
.settle {
  animation: settle 0.9s ease-out 1;
}
.skeleton {
  border-radius: 8px;
  background: linear-gradient(90deg, #ebe9e4 25%, #f6f5f2 37%, #ebe9e4 63%);
  background-size: 200% 100%;
  animation: shimmer 1.4s linear infinite;
}
.caret::after {
  content: "▍";
  margin-left: 1px;
  color: var(--color-accent-500);
  animation: blink 1s steps(1) infinite;
}
.call-ring {
  animation: ring 1.6s ease-out infinite;
}
.check-draw {
  stroke-dasharray: 1;
  animation: check 0.28s ease-out both;
}
.overlay-backdrop {
  transition: opacity var(--dur-base) ease;
}
.overlay-backdrop[data-state="closed"] {
  opacity: 0;
}
.drawer-panel {
  transition: transform var(--dur-slow) var(--ease-expo);
}
.drawer-panel[data-state="closed"] {
  transform: translateX(104%);
}
.modal-panel {
  transition: transform var(--dur-base) var(--ease-expo), opacity var(--dur-fast) ease;
}
.modal-panel[data-state="closed"] {
  transform: translateY(10px) scale(0.97);
  opacity: 0;
}
.toast {
  transition: transform 0.35s var(--ease-expo), opacity 0.25s ease;
}
.toast[data-state="closed"] {
  transform: translateX(24px);
  opacity: 0;
}
.lift {
  transition: transform var(--dur-base) var(--ease-expo), box-shadow var(--dur-base) ease, border-color var(--dur-fast) ease;
}
.lift:hover {
  transform: translateY(-2px);
  box-shadow: var(--shadow-lift);
  border-color: #d6d2ca;
}
.press {
  transition: transform 120ms ease, background-color var(--dur-fast) ease, border-color var(--dur-fast) ease, color var(--dur-fast) ease, box-shadow var(--dur-fast) ease;
}
.press:active {
  transform: scale(0.97);
}
.tabular {
  font-variant-numeric: tabular-nums;
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-delay: 0ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
}
.aurora {
  background-color: var(--color-surface);
  background-image: radial-gradient(520px 300px at 96% 0%, rgb(255 61 71 / 0.13), transparent 65%), radial-gradient(460px 320px at 70% 110%, rgb(138 111 232 / 0.13), transparent 62%), radial-gradient(520px 320px at 30% -30%, rgb(59 125 184 / 0.12), transparent 62%);

.hairline-accent {
